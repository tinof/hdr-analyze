<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">HDR-Analyze</title>
  <desc id="hero-desc">HDR-Analyze: the SMPTE ST 2084 PQ transfer curve plotted over luminance in nits with a scene's L1 minimum, average and maximum marked on it. Converts HDR10, HDR10+ and HLG video to Profile 8.1 or 8.4 Dolby Vision MKVs without re-encoding.</desc>
  <defs>
    <linearGradient id="under-curve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="24" fill="#0b0d10"/>
  <g id="title-block">
    <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.5" fill="#9aa1ab">OPEN-SOURCE HDR ANALYSIS CLI</text>
    <text x="62" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#f4f1ea">HDR-Analyze</text>
    <text x="64" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#f4f1ea" fill-opacity="0.86">Measures HDR10, HDR10+ and HLG video</text>
    <text x="64" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#f4f1ea" fill-opacity="0.86">and converts it to Dolby Vision</text>
    <text x="64" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#f4f1ea" fill-opacity="0.86">without re-encoding the picture.</text>
    <rect x="64" y="302" width="40" height="3" fill="#ffb000"/>
    <text x="64" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9aa1ab">HDR10 · HDR10+ · HLG → Profile 8.1 / 8.4 MKV</text>
  </g>
