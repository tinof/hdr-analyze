name: Setup integration-test tools
description: >
  Install the external tools the workspace integration tests run on Ubuntu: the ffmpeg CLI
  (with libx265), mkvtoolnix, mediainfo, and pinned, checksum-verified dovi_tool and
  hdr10plus_tool builds. Without them the HLG, open-GOP, HDR10+ and clip-based tests print a
  `Skipping` line and pass. ci.yml and release.yml both use this action, so the pins cannot
  drift between the PR gate and the release gate. The apt packages go through the apt-install
  action (cached, mirror-safe).

runs:
  using: composite
  steps:
    - name: Install ffmpeg, mkvtoolnix and mediainfo
      uses: ./.github/actions/apt-install
      with:
        packages: ffmpeg mkvtoolnix mediainfo

    - name: Install pinned dovi_tool and hdr10plus_tool
      shell: bash
      env:
        # dovi_tool for the mkvdovi integration tests; bump both together. dovi_rpu_builder pins the
        # same version (DOVI_TOOL_VERSION in dovi_rpu_builder/tests/dovi_tool_live.rs, and
        # tests/fixtures/make_fixtures.sh): bump those and regenerate the fixtures with it, or the
        # live test prints `Skipping` and the test gate fails.
        DOVI_TOOL_VERSION: 2.3.4
        DOVI_TOOL_SHA256: 1844258e13c26607b32224bf1fa82b595d3b35949f5467405fda560daad32b3f
        # hdr10plus_tool for the HDR10+ integration test (mkvdovi/tests/hdr10plus_hybrid.rs);
        # bump both together.
        HDR10PLUS_TOOL_VERSION: 1.7.2
        HDR10PLUS_TOOL_SHA256: 06385f37a639d61ba21d4be3150c863846933bc3b58110e094d8fc8f1c2249f2
      run: |
        archive="$RUNNER_TEMP/dovi_tool.tar.gz"
        curl -fsSL -o "$archive" \
          "https://github.com/quietvoid/dovi_tool/releases/download/${DOVI_TOOL_VERSION}/dovi_tool-${DOVI_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${DOVI_TOOL_SHA256}  $archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/tools"
        tar xzf "$archive" -C "$RUNNER_TEMP/tools"
        archive="$RUNNER_TEMP/hdr10plus_tool.tar.gz"
        curl -fsSL -o "$archive" \
          "https://github.com/quietvoid/hdr10plus_tool/releases/download/${HDR10PLUS_TOOL_VERSION}/hdr10plus_tool-${HDR10PLUS_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${HDR10PLUS_TOOL_SHA256}  $archive" | sha256sum -c -
        tar xzf "$archive" -C "$RUNNER_TEMP/tools"
        echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
