name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or Update Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: HDR-Analyze Suite ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## HDR-Analyze Suite ${{ github.ref_name }}
            
            This release includes **three tools** for HDR video analysis and processing:
            
            ### 🎬 Included Tools
            
            | Tool | Description |
            |------|-------------|
            | `hdr_analyzer_mvp` | HDR10/HLG frame analyzer and measurement generator |
            | `mkvdovi` | HDR10/HDR10+/HLG to Profile 8.1 converter (CM v4.0 metadata) |
            | `verifier` | madVR measurement file verification utility |
            
            ### 📦 Download
            
            Choose the appropriate archive for your platform:
            
            | Platform | Archive |
            |----------|---------|
            | **Windows (x64)** | `hdr-analyze-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip` |
            | **macOS (Intel)** | `hdr-analyze-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz` |
            | **macOS (Apple Silicon)** | `hdr-analyze-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz` |
            | **Linux (x64)** | `hdr-analyze-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz` |
            
            ### ⚡ One-Line Install
            
            **Linux/macOS:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
            ```
            
            **Windows (PowerShell):**
            ```powershell
            irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
            ```
            
            ### ⚙️ Prerequisites
            
            - **FFmpeg** must be installed and available in your system PATH (the Windows zip
              bundles the LGPL FFmpeg libraries the analyzer links against; `mkvdovi` still
              calls the `ffmpeg` command-line tool)
            - **mkvdovi** also requires `mkvmerge`, `dovi_tool` 2.3.2 or newer (2.3.4+ recommended),
              and `hdr10plus_tool` when converting HDR10+ sources
            
            ### 🚀 Quick Start
            
            ```bash
            # HDR10 analysis
            ./hdr_analyzer_mvp -i input.mkv -o measurements.bin
            
            # Convert to Profile 8.1 while preserving the source for A/B testing
            ./mkvdovi --keep-source --verify input.mkv
            
            # Verify binary files
            ./verifier --help
            ```
            
            ### 📝 What's New
            
            - **Transitional `mkvdolby` alias removed.** The converter is `mkvdovi`; archives no
              longer ship the pre-v0.3.0 alias. Update any scripts that still invoke `mkvdolby`.
            - **Measured PQ max-RGB peaks:** direct PQ peaks now default to BT.2020 NCL max-RGB,
              validated against synthetic truth and licensed reference tooling; use
              `--peak-domain luma` for the legacy Y-luma measurement.
            - **Resilient long conversions:** live byte progress, stall warnings, graceful
              interruption, and automatic resume from completed artifacts.
            - **Published validation and provenance:** reproducible accuracy tables and a documented
              source-material boundary for licensed-tool comparisons.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for detailed changes.
            
            ### 🆘 Support
            
            - [Report Issues](https://github.com/${{ github.repository }}/issues)
            - [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)

  upload-install-scripts:
    name: Upload Install Scripts
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload Install Scripts
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            scripts/install.sh
            scripts/install.ps1

  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup FFmpeg
        id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Build All Binaries
        run: cargo build --verbose --release --workspace --target ${{ matrix.target }}

      - name: Build Archive
        shell: bash
        run: |
          staging="hdr-analyze-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging/bin"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          for bin in hdr_analyzer_mvp mkvdovi verifier; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "$staging/bin/"
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Ship the LGPL FFmpeg runtime next to the .exe files so they run out of the box.
            bash scripts/ci/bundle-windows-ffmpeg.sh "${{ steps.ffmpeg.outputs.bin-dir }}" "$staging/bin"
          else
            cp scripts/mkvdovi_hifi_workflow.sh "$staging/bin/"
          fi
          cp README.md CHANGELOG.md LICENSE "$staging/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="$staging.zip"
            7z a "$asset" "$staging"
          else
            asset="$staging.tar.gz"
            tar czf "$asset" "$staging"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ASSET }}

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Run Tests
        run: cargo test --verbose --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --release -- -D warnings

      - name: Check Formatting
        run: cargo fmt --all -- --check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Security Audit
        run: cargo audit

  update-release-notes:
    name: Update Release Notes
    needs: [create-release, build, test, security-audit]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Release with Build Status
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag_name = context.ref.replace('refs/tags/', '');

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag_name
            });

            const updatedBody = release.body + `

            ---

            ### ✅ Build Status

            All builds completed successfully:
            - ✅ Cross-platform builds (Windows, macOS Intel, macOS ARM, Linux)
            - ✅ All three tools built: \`hdr_analyzer_mvp\`, \`mkvdovi\`, \`verifier\`
            - ✅ Test suite passed
            - ✅ Code quality checks (clippy, formatting)
            - ✅ Security audit passed

            ### 📋 Archive Contents

            Each archive contains:
            \`\`\`
            hdr-analyze-${tag_name}-<platform>/
            ├── bin/
            │   ├── hdr_analyzer_mvp
            │   ├── mkvdovi
            │   ├── verifier
            │   ├── mkvdovi_hifi_workflow.sh (Linux/macOS)
            │   └── FFmpeg LGPL DLLs + FFMPEG-LICENSE.txt (Windows)
            ├── README.md
            ├── CHANGELOG.md
            └── LICENSE
            \`\`\`

            ### 🔐 Verification

            After downloading, verify the binaries:
            \`\`\`bash
            ./bin/hdr_analyzer_mvp --help
            ./bin/mkvdovi --help
            ./bin/verifier --help
            \`\`\`
            `;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: updatedBody
            });

  notify-completion:
    name: Notify Release Completion
    needs: [create-release, build, test, security-audit, update-release-notes]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Release Status Summary
        run: |
          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests** | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security Audit** | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Included Tools" >> $GITHUB_STEP_SUMMARY
          echo "- \`hdr_analyzer_mvp\` - HDR10+ analyzer" >> $GITHUB_STEP_SUMMARY
          echo "- \`mkvdovi\` - Dolby Vision processor" >> $GITHUB_STEP_SUMMARY
          echo "- \`verifier\` - Binary verifier" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download**: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
