name: Release

# A pushed vX.Y.Z or vX.Y.Z-rc.N tag builds, tests and publishes a release. Nothing is public
# until every job has passed: the publish job creates the release as a draft with all assets,
# then publishes it. An -rc.N tag becomes a pre-release, which never counts as "latest", so
# install.sh keeps installing the last stable release. The process is in docs/RELEASING.md.
#
# A pull request that changes the release machinery, and a manual run, do everything except
# publishing, for the version in the manifests (a dry run). scripts/release-check.sh requires a
# successful run of this workflow on the commit about to be tagged: `gh workflow run release.yml`.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-ffmpeg/**
      - .github/actions/setup-test-tools/**
      - .github/actions/apt-install/**
      - scripts/ci/apt-install.sh
      - scripts/ci/release-*.sh
      - scripts/ci/check-test-skips.sh
      - scripts/ci/bundle-windows-ffmpeg.sh
      - scripts/install.sh
      # The CUDA analysis kernel and its loader: the two cuda archives embed kernels.ptx.
      - hdr_analyzer_mvp/src/analysis/kernels.cu
      - hdr_analyzer_mvp/src/analysis/kernels.ptx
      - hdr_analyzer_mvp/src/analysis/gpu/backend.rs
      - scripts/gen-kernels-ptx.sh
      - scripts/ci/nvrtc*
      # The aarch64 Linux linker setting and the toolchain; ci.yml builds neither ARM64 Linux nor
      # macOS Intel. Cargo.lock and the manifests are left out on purpose: every dependency bump
      # would run five release builds. The pre-flight requires a dispatch run before each tag.
      - .cargo/config.toml
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that may be publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml sets `-C target-cpu=native` for local builds. A RUSTFLAGS variable,
  # even an empty one, replaces it, so release binaries target the default baseline CPU
  # instead of whatever CPU this runner has (which crashes on other machines).
  RUSTFLAGS: ""

jobs:
  check:
    name: Check tag, versions and notes
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve the tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT == push && $GITHUB_REF_TYPE == tag ]]; then
            tag=$GITHUB_REF_NAME
            publish=true
          else
            # Dry run: check the version in the manifests as if it were tagged.
            tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' mkvdovi/Cargo.toml | head -n 1)"
            publish=false
          fi
          prerelease=false
          [[ $tag == *-* ]] && prerelease=true
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $tag, pre-release $prerelease, publish $publish"
      - name: Versions, Cargo.lock and CHANGELOG.md match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/ci/release-version-check.sh "$TAG"
      - name: Release notes can be generated
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/ci/release-notes.sh "$TAG" > /dev/null

  test:
    name: Lint and test (no unexpected skips)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Only main saves (a dry run dispatched on main); tag runs restore main's caches.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-ffmpeg
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo clippy, analyzer with the cuda feature (deny warnings)
        run: cargo clippy --locked -p hdr_analyzer_mvp --all-targets --features cuda -- -D warnings
      # --locked everywhere: a Cargo.lock that does not match the manifests fails here, before
      # any build, instead of each runner resolving its own dependency versions.
      # Without these tools the HLG, open-GOP and clip-based tests skip and pass.
      - uses: ./.github/actions/setup-test-tools
      # The HLG tests use the hdr_analyzer_mvp built next to mkvdovi. There is no GPU, so the
      # CUDA parity test is skipped by name. Ubuntu's libx265 has no HDR10_PLUS support.
      - name: cargo test, every skip accounted for
        shell: bash
        run: |
          cargo build --locked -p hdr_analyzer_mvp
          cargo test --locked --workspace -- --nocapture --skip cuda_output_matches_cpu 2>&1 | tee "$RUNNER_TEMP/test.log"
          scripts/ci/check-test-skips.sh "$RUNNER_TEMP/test.log" 'built without HDR10_PLUS|does not accept dhdr10-info'

  security-audit:
    name: Security audit
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run security audit
        run: cargo audit

  build:
    name: Build (${{ matrix.target }})
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # features: cuda builds the analyzer with GPU analysis (ROADMAP E12). The kernel is
          # embedded PTX, so users need only the NVIDIA driver; without one it analyzes on the CPU.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            features: cuda
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: cuda

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ needs.check.outputs.tag }}
      FEATURES: ${{ matrix.features }}

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # .cargo/config.toml links aarch64 Linux through clang, installed here with the FFmpeg dev
      # libs. The empty RUSTFLAGS drops its `-fuse-ld=lld`, so the default linker is used. The
      # Linux cuda archive needs the ffmpeg CLI for its smoke clip; Windows has BtbN's on PATH.
      - id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          extra-packages: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'clang' || matrix.target == 'x86_64-unknown-linux-gnu' && 'ffmpeg' || '' }}

      - name: Build all binaries
        shell: bash
        run: |
          flags=()
          [ "$FEATURES" = cuda ] && flags=(-F hdr_analyzer_mvp/cuda)
          cargo build --locked --verbose --release --workspace --target ${{ matrix.target }} "${flags[@]}"

      - name: Build archive
        shell: bash
        run: |
          staging="hdr-analyze-$TAG-${{ matrix.target }}"
          mkdir -p "$staging/bin" dist
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          for bin in hdr_analyzer_mvp mkvdovi verifier; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "$staging/bin/"
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Ship the LGPL FFmpeg runtime next to the .exe files so they run out of the box.
            bash scripts/ci/bundle-windows-ffmpeg.sh "${{ steps.ffmpeg.outputs.bin-dir }}" "$staging/bin"
          else
            cp scripts/mkvdovi_hifi_workflow.sh "$staging/bin/"
          fi
          cp README.md CHANGELOG.md CONTRIBUTING.md ROADMAP.md LICENSE "$staging/"
          cp -R docs "$staging/docs"
          # Every binary must start from the archive and report the tagged version.
          for bin in hdr_analyzer_mvp mkvdovi verifier; do
            out=$("$staging/bin/$bin$ext" --version)
            echo "$out"
            [[ $out == *"${TAG#v}"* ]] || { echo "::error::$bin reports '$out', expected ${TAG#v}"; exit 1; }
          done
          # mkvdovi reads "+cuda" in the analyzer's --version to decide on GPU analysis.
          out=$("$staging/bin/hdr_analyzer_mvp$ext" --version)
          if [ "$FEATURES" = cuda ]; then
            [[ $out == *"(+cuda)"* ]] || { echo "::error::cuda archive analyzer reports '$out', expected (+cuda)"; exit 1; }
            # The runner has no NVIDIA driver: --hwaccel cuda must fall back to CPU analysis and
            # software decode, and still write the measurements.
            smoke="$RUNNER_TEMP/smoke"
            mkdir -p "$smoke"
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=24:duration=1 \
              -pix_fmt yuv420p10le -c:v ffv1 -color_primaries bt2020 -color_trc smpte2084 \
              -colorspace bt2020nc -color_range tv "$smoke/smoke.mkv"
            "$staging/bin/hdr_analyzer_mvp$ext" "$smoke/smoke.mkv" -o "$smoke/smoke.bin" \
              --transfer pq --hwaccel cuda > "$smoke/log.txt" 2>&1 \
              || { cat "$smoke/log.txt"; echo "::error::--hwaccel cuda without a driver failed"; exit 1; }
            cat "$smoke/log.txt"
            grep -q 'CUDA analysis unavailable' "$smoke/log.txt" \
              || { echo "::error::no CPU fallback message without a driver"; exit 1; }
            [ -s "$smoke/smoke.bin" ] || { echo "::error::no measurements written"; exit 1; }
            jq -e '.analysis.gpu == false' "$smoke/smoke.bin.l1.json" > /dev/null \
              || { echo "::error::the sidecar does not record CPU analysis"; exit 1; }
          else
            [[ $out != *"+cuda"* ]] || { echo "::error::$out: only the x86_64 Linux and Windows archives have cuda"; exit 1; }
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/$staging.zip" "$staging"
          else
            tar czf "dist/$staging.tar.gz" "$staging"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: hdr-analyze-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [check, test, security-audit, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      PUBLISH: ${{ needs.check.outputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v8
        with:
          pattern: hdr-analyze-*
          path: dist
          merge-multiple: true

      - name: Assets, checksums and notes
        shell: bash
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          RUSTC_VERSION="$(rustc --version)" scripts/ci/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          {
            echo "## Assets for $TAG (publish: $PUBLISH)"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md"

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # gh uploads every asset while the release is a draft and publishes it last. With
      # immutable releases on, a published release can no longer take assets.
      - name: Create the draft, upload assets, publish
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ $draft != true ]]; then
              echo "::error::Release $TAG is already published. Never re-tag; release the next version."
              exit 1
            fi
            # A draft left by an earlier failed attempt was never public.
            gh release delete "$TAG" --yes
          fi
          if [[ $PRERELEASE == true ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          gh release create "$TAG" --draft --verify-tag \
            --title "HDR-Analyze Suite $TAG" --notes-file "$RUNNER_TEMP/notes.md" dist/*
          gh release edit "$TAG" --draft=false "${flags[@]}"
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Release summary
    needs: [check, test, security-audit, build, publish]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "## Release ${{ needs.check.outputs.tag }}"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Check | ${{ needs.check.result }} |"
            echo "| Lint and test | ${{ needs.test.result }} |"
            echo "| Security audit | ${{ needs.security-audit.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Publish | ${{ needs.publish.result }} (publish: ${{ needs.check.outputs.publish }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
