name: CI

on:
  push:
    branches: [ main, "fix-*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Weekly RustSec check: the advisory jobs run on pull requests only when dependencies change.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# The event is part of the group, so the weekly run and a push run on main never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml sets `-C target-cpu=native` for local builds. A RUSTFLAGS variable,
  # even an empty one, replaces it: CI then builds what the release builds, and cached
  # proc-macro libraries no longer depend on the CPU of the runner that built them (a cache
  # from a newer CPU made rustc crash with STATUS_ILLEGAL_INSTRUCTION on an older runner).
  RUSTFLAGS: ""

jobs:
  # Which jobs this run needs (scripts/ci/ci-changes.sh). A pull request that changes only
  # Markdown, docs/ or LICENSE skips the Rust jobs, and this job is then its one passing check
  # (/ship needs at least one). push and workflow_dispatch run everything, the weekly schedule
  # only the advisory jobs. When the file list cannot be read, every job runs.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      gemini: ${{ steps.changes.outputs.gemini }}
      deps: ${{ steps.changes.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
      - name: Test the change filter
        run: scripts/ci/tests/ci-changes-test.sh
      - name: Changed paths
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          EVENT: ${{ github.event_name }}
        run: scripts/ci/ci-changes.sh "$EVENT"

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Only main saves: a pull request's cache serves only re-runs of that pull request, and
      # pull requests restore main's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-ffmpeg
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The CUDA analysis backend is the main pipeline but has no GPU runner. cudarc loads the
      # driver and NVRTC at runtime, so this compiles and lints without a GPU or CUDA toolkit.
      - name: cargo clippy, analyzer with the cuda feature (deny warnings)
        run: cargo clippy -p hdr_analyzer_mvp --all-targets --features cuda -- -D warnings

  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-24.04
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-ffmpeg
      # Without these tools the HLG, open-GOP, HDR10+ and clip-based tests print `Skipping` and
      # pass, so PR CI would be green on a broken conversion path. Same tools and pins as release.yml.
      - uses: ./.github/actions/setup-test-tools
      # The HLG tests use the hdr_analyzer_mvp built next to mkvdovi. There is no GPU, so the
      # CUDA parity test is skipped by name. Ubuntu's libx265 has no HDR10_PLUS support.
      # `shell: bash` runs with -eo pipefail, so a failing cargo test is not hidden by tee.
      - name: cargo test, every skip accounted for
        shell: bash
        run: |
          cargo build --locked -p hdr_analyzer_mvp
          cargo test --locked --workspace --verbose -- --nocapture --skip cuda_output_matches_cpu 2>&1 | tee "$RUNNER_TEMP/test.log"
          scripts/ci/check-test-skips.sh "$RUNNER_TEMP/test.log" 'built without HDR10_PLUS|does not accept dhdr10-info'

  l1-regression:
    name: L1 regression gate
    runs-on: ubuntu-24.04
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/l1_diff -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The FFmpeg CLI encodes the synthetic clip.
      - uses: ./.github/actions/setup-ffmpeg
        with:
          extra-packages: ffmpeg
      # tools/l1_diff is outside the workspace, so the lint and test jobs do not cover it.
      - name: l1_diff fmt, clippy, test
        run: |
          cargo fmt --manifest-path tools/l1_diff/Cargo.toml -- --check
          cargo clippy --manifest-path tools/l1_diff/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/l1_diff/Cargo.toml
      - name: Score the synthetic corpus against the committed references
        run: scripts/ci/l1-regression-gate.sh

  # dovi_rpu_builder is linked into an Android app by the NuvioTV fork (aarch64-linux-android).
  # A check of a library needs only the target's std, not the NDK. tools/rpu_builder_check is
  # outside the workspace (its serde features would reorder mkvdovi's extra.json), so the lint
  # and test jobs do not cover it.
  rpu-builder:
    name: RPU builder (Android check, fixture tool)
    runs-on: ubuntu-24.04
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/rpu_builder_check -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check, aarch64-linux-android
        run: cargo check --locked --target aarch64-linux-android -p dovi_rpu_builder
      - name: rpu_builder_check fmt, clippy, test
        run: |
          cargo fmt --manifest-path tools/rpu_builder_check/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/rpu_builder_check/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/rpu_builder_check/Cargo.toml

  # The Gemini pre-PR pass (.claude/workflows/pre-pr-gemini.sh) against a fake agy: no network,
  # no model, about a minute. Linux only, because its cleanup scans /proc/*/environ. Runs when
  # the paths of the gemini-harness gate in .claude/workflow.md change, and on main.
  gemini-harness:
    name: Gemini pass harness (fake agy)
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.gemini == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run the fake-agy harness
        run: .claude/workflows/tests/pre-pr-gemini-test.sh

  # Does not wait for test: the release builds run beside it after lint. A red test still fails
  # the run, and nothing merges on a red check.
  build:
    name: Build (xplat)
    runs-on: ${{ matrix.os }}
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
      - name: cargo build
        run: cargo build --release --workspace --verbose
      - name: Smoke-test Windows FFmpeg DLL bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cp target/release/*.exe "$RUNNER_TEMP/bundle/"
          bash scripts/ci/bundle-windows-ffmpeg.sh "${{ steps.ffmpeg.outputs.bin-dir }}" "$RUNNER_TEMP/bundle"

  # The advisory jobs run on pull requests that change a manifest, Cargo.lock or deny.toml, on
  # main, and weekly, so a new RustSec advisory cannot fail an unrelated pull request.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.deps == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run Security Audit
        run: cargo audit

  cargo-deny:
    name: Dependency Check (cargo-deny)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.deps == 'true'
    timeout-minutes: 10
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
