name: CI

on:
  push:
    branches: [ main, "fix-*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-ffmpeg
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-ffmpeg
      - name: cargo test (locked)
        run: cargo test --workspace --verbose

  build:
    name: Build (xplat)
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
      - name: cargo build
        run: cargo build --release --workspace --verbose
      - name: Smoke-test Windows FFmpeg DLL bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cp target/release/*.exe "$RUNNER_TEMP/bundle/"
          bash scripts/ci/bundle-windows-ffmpeg.sh "${{ steps.ffmpeg.outputs.bin-dir }}" "$RUNNER_TEMP/bundle"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run Security Audit
        run: cargo audit

  cargo-deny:
    name: Dependency Check (cargo-deny)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
