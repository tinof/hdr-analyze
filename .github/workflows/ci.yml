name: CI

on:
  push:
    branches: [ main, "fix-*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml sets `-C target-cpu=native` for local builds. A RUSTFLAGS variable,
  # even an empty one, replaces it: CI then builds what the release builds, and cached
  # proc-macro libraries no longer depend on the CPU of the runner that built them (a cache
  # from a newer CPU made rustc crash with STATUS_ILLEGAL_INSTRUCTION on an older runner).
  RUSTFLAGS: ""

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-ffmpeg
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The CUDA analysis backend is the main pipeline but has no GPU runner. cudarc loads the
      # driver and NVRTC at runtime, so this compiles and lints without a GPU or CUDA toolkit.
      - name: cargo clippy, analyzer with the cuda feature (deny warnings)
        run: cargo clippy -p hdr_analyzer_mvp --all-targets --features cuda -- -D warnings

  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-ffmpeg
      - name: cargo test (locked)
        run: cargo test --workspace --verbose

  l1-regression:
    name: L1 regression gate
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/l1_diff -> target
      - uses: ./.github/actions/setup-ffmpeg
      - name: Install the FFmpeg CLI (encodes the synthetic clip)
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      # tools/l1_diff is outside the workspace, so the lint and test jobs do not cover it.
      - name: l1_diff fmt, clippy, test
        run: |
          cargo fmt --manifest-path tools/l1_diff/Cargo.toml -- --check
          cargo clippy --manifest-path tools/l1_diff/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/l1_diff/Cargo.toml
      - name: Score the synthetic corpus against the committed references
        run: scripts/ci/l1-regression-gate.sh

  # The Gemini pre-PR pass (.claude/workflows/pre-pr-gemini.sh) against a fake agy: no network,
  # no model, about a minute. Linux only, because its cleanup scans /proc/*/environ.
  gemini-harness:
    name: Gemini pass harness (fake agy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run the fake-agy harness
        run: .claude/workflows/tests/pre-pr-gemini-test.sh

  build:
    name: Build (xplat)
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg
      - name: cargo build
        run: cargo build --release --workspace --verbose
      - name: Smoke-test Windows FFmpeg DLL bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cp target/release/*.exe "$RUNNER_TEMP/bundle/"
          bash scripts/ci/bundle-windows-ffmpeg.sh "${{ steps.ffmpeg.outputs.bin-dir }}" "$RUNNER_TEMP/bundle"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run Security Audit
        run: cargo audit

  cargo-deny:
    name: Dependency Check (cargo-deny)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
